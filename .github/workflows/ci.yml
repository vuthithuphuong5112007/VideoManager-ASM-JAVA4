name: Java CI - Build and Test

on:
  push:
    branches: [ phuong ]   # Chạy mỗi khi push nhánh 'phuong'
  pull_request:
    branches: [ phuong ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run unit tests
        run: mvn test